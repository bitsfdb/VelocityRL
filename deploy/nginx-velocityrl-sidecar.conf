# VelocityRL & RLIM In-Game IPC Sidecar Gateway
# Ports:
#   15759 - owned by VelocityRL Rust broker (do not bind here)
#   7546  - RLIM Keypad Port (R=7, L=5, I=4, M=6)
#   49320 - Shift Legacy Mod Port

server {
    listen 7546;
    listen [::]:7546;
    listen 49320;
    listen [::]:49320;
    listen 49325;
    listen [::]:49325;

    server_name _;

    client_max_body_size 64M;

    location = /thumbnails/rl_japan {
        proxy_pass http://127.0.0.1:8000/thumbnails/rl_japan.png;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standard REST & Static routes
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
