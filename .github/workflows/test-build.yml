name: Test Build

# Manual, on-demand Windows build for testing a branch before release.
# Builds the installer and uploads it as a workflow ARTIFACT only — it never
# creates or publishes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: 'main'

env:
  BUILD_REF: ${{ inputs.ref || 'main' }}

jobs:
  test-build:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm install

      - name: Create stub sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          New-Item -ItemType File -Force -Path "src-tauri/bin/velocity-engine-x86_64-pc-windows-msvc.exe" | Out-Null

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      # Native PsyNet MITM lives in-process; leaf private keys are compile-time
      # include_bytes! — there is no Go sidecar to build.
      - name: Assert native PsyNet cert compile inputs
        shell: pwsh
        run: |
          $certs = Join-Path $PWD 'src-tauri/resources/certs'
          $required = @(
            'velocityrl_ca.crt',
            'leaf_config.psynet.gg.crt',
            'leaf_config.psynet.gg.key',
            'leaf_ws.rlpp.psynet.gg.crt',
            'leaf_ws.rlpp.psynet.gg.key'
          )
          foreach ($f in $required) {
            $p = Join-Path $certs $f
            if (-not (Test-Path -LiteralPath $p)) {
              throw "missing native proxy compile asset: $p (run src-tauri/resources/certs/gen_certs.py or restore matching leaf keys)"
            }
          }
          Write-Host "Native PsyNet cert inputs OK ($($required.Count) files)"

      - name: Build installer (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIAGNOSTIC_URL: ${{ secrets.DIAGNOSTIC_URL }}
          DIAGNOSTIC_SECRET: ${{ secrets.DIAGNOSTIC_SECRET }}

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $patterns = @(
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/bundle/nsis/*.exe"
          )
          foreach ($pattern in $patterns) {
            foreach ($f in (Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($f.Name)" | Set-Content "$($f.FullName).sha256"
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VelocityRL-test-${{ env.BUILD_REF }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
