name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (e.g. v2.2.1)'
        required: true

# Builds installers and uploads them as workflow ARTIFACTS only.
# It never creates or publishes a GitHub Release.
env:
  BUILD_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  release:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm install

      # Native PsyNet MITM lives in-process (src-tauri/src/proxy.rs). Leaf private
      # keys are compile-time include_bytes! — there is no Go sidecar to build.
      - name: Assert native PsyNet cert compile inputs
        shell: pwsh
        run: |
          $certs = Join-Path $PWD 'src-tauri/resources/certs'
          $required = @(
            'velocityrl_ca.crt',
            'leaf_config.psynet.gg.crt',
            'leaf_config.psynet.gg.key',
            'leaf_ws.rlpp.psynet.gg.crt',
            'leaf_ws.rlpp.psynet.gg.key'
          )
          foreach ($f in $required) {
            $p = Join-Path $certs $f
            if (-not (Test-Path -LiteralPath $p)) {
              throw "missing native proxy compile asset: $p (run src-tauri/resources/certs/gen_certs.py or restore matching leaf keys)"
            }
          }
          Write-Host "Native PsyNet cert inputs OK ($($required.Count) files)"

      - name: Build (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIAGNOSTIC_URL: ${{ secrets.DIAGNOSTIC_URL }}
          DIAGNOSTIC_SECRET: ${{ secrets.DIAGNOSTIC_SECRET }}

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $patterns = @(
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/appimage/*.AppImage",
            "src-tauri/target/release/bundle/deb/*.deb"
          )
          foreach ($pattern in $patterns) {
            foreach ($f in (Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($f.Name)" | Set-Content "$($f.FullName).sha256"
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VelocityRL-${{ env.BUILD_REF }}-${{ runner.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/rpm/*.rpm*
